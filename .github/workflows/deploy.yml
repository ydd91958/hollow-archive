name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 类型检查跟着构建一起跑，坏的代码不会被部署上去
      - run: npm run build
        env:
          # Pages 不在根路径，仓库名就是子路径
          PAGES_BASE: /${{ github.event.repository.name }}/

      # SPA 深链需要这一步：Pages 对未知路径返回 404.html，
      # 把它做成 index.html 的副本，前端路由才能接管 /forum、/sys 这些地址
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
